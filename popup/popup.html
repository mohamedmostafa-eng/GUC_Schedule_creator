<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUC Timetable Matrix</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Control Bar -->
    <header class="header">
      <div class="branding">
        <div class="logo-icon">GUC</div>
        <div class="title-wrap">
          <h1>Timetable Matrix</h1>
          <span id="statusIndicator" class="status-badge status-loading">Scanning Tab...</span>
        </div>
      </div>

      <div class="actions">
        <button id="exportIcsBtn" class="btn btn-secondary" title="Export recurring schedule to Google/Apple Calendar" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          Export .ics
        </button>
      </div>
    </header>

    <!-- Error / Info Banner -->
    <div id="errorBanner" class="error-banner hidden">
      <span id="errorText"></span>
      <button id="openScheduleBtn" class="btn-link error-link hidden">Open my GUC schedule →</button>
    </div>

    <!-- Dynamic Filter Form -->
    <section class="filter-bar">
      <div class="select-group">
        <label for="tutSelect">Tutorial / Practical Group</label>
        <select id="tutSelect" disabled>
          <option value="">Select Group...</option>
        </select>
        <span id="tutTranslator" class="translator-subtitle hidden"></span>
      </div>

      <div class="select-group">
        <label for="deSelect">German Level</label>
        <select id="deSelect" disabled>
          <option value="">Select German...</option>
        </select>
      </div>

      <div class="select-group">
        <label for="smSelect">Elective / Humanities</label>
        <select id="smSelect" disabled>
          <option value="">Select Elective...</option>
        </select>
      </div>
    </section>

    <!-- Main Schedule Display -->
    <main id="timetableContainer" class="timetable-wrapper">
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">📅</div>
        <h3>No Schedule Loaded</h3>
        <p>Navigate to your GUC semester schedule on <code>apps.guc.edu.eg</code> to parse and view your matrix.</p>
      </div>

      <div id="gridMatrix" class="matrix-grid hidden">
        <!-- Generated dynamically by popup.js -->
      </div>
    </main>

    <!-- Footer Meta -->
    <footer class="footer">
      <span id="syncTimestamp">Not Synced</span>
      <button id="refreshBtn" class="btn-link">Force Re-scan</button>
    </footer>
  </div>

  <script src="../shared-constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
